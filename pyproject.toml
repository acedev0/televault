[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "televault"
version = "1.3.0"
description = "Stream a private Telegram chat as a password-protected media library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ace" }]
dependencies = [
  "fastapi==0.162.5",
  "uvicorn[standard]==0.54.0",
  "Telethon==1.46.0",
  "cryptography==50.0.2",
  "argon2-cffi==25.1.0",
  "Jinja2==3.1.6",
  "python-multipart==0.0.32",
  "itsdangerous==2.2.0",
  "Pillow==12.3.0",
]

[project.scripts]
televault = "televault.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["televault*"]

[tool.setuptools.package-data]
televault = ["templates/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["pytests"]
asyncio_mode = "auto"
pythonpath = ["."]
